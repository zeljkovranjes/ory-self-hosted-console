[package]
name = "ory-console-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Ory Self-Hosted Console backend — single API layer the frontend talks to (structured Salvo app + console-DB persistence; Phase 2)."
license = "Apache-2.0"
publish = false

[features]
# WR-01: the FLAG-01 keystone probe route (`/api/features/_probe`) is a
# TEST-ONLY anchor — it has no business purpose and must NOT ship in a normal
# production binary (a dead route gated on the real `saml` flag is attack-surface
# + audit noise the moment an operator enables saml). It is gated behind this
# OFF-BY-DEFAULT feature so `cargo build`/the production Docker image carry no
# probe. It is activated in two places ONLY: (1) automatically for `cargo test`
# via the dev-dependency self-reference below (so the integration suite, which
# does NOT see the lib's `#[cfg(test)]`, still has the route to anchor FLAG-01),
# and (2) the live acceptance harness, which builds the backend image with
# `--features test-probe` (compose `TEST_PROBE=1` build-arg). Mirrors the
# existing OFF-by-default `WEBHOOK_ALLOW_PRIVATE_TARGETS` acceptance pattern.
test-probe = []

# --- Phase 17: event-stream sink adapters (EVT-01) — OFF BY DEFAULT ----------
# These two features gate the OPTIONAL non-webhook sink adapters. They are NOT in
# any `default` set: a plain `cargo build` / `cargo build --release` and the
# production Docker image compile NEITHER adapter crate — the default build ships
# the pure-Rust webhook sink ONLY (reusing webhooks::{ssrf,hmac} with zero new
# deps). This is the load-bearing invariant: `cargo tree -i async-nats` /
# `-i rdkafka` MUST report "not found" in the default graph.
#
# C-TOOLCHAIN ISOLATION: `rdkafka` (events-kafka) statically compiles bundled
# librdkafka from C sources and therefore needs gcc + make + cmake + libcurl-dev
# (+ libssl-dev / libsasl2-dev for ssl/sasl). The default zero-apt
# `rust:1.95-slim-bookworm` builder has NONE of these — keeping events-kafka OFF
# by default keeps the production image lean. Only an explicit
# `cargo build --features events-kafka` (a separate, documented Dockerfile stage)
# pulls the toolchain. `async-nats` (events-nats) is pure-Rust (rustls/ring) — no
# C toolchain — but is feature-gated for symmetry and to keep the default dep
# graph minimal.
events-nats = ["dep:async-nats"]
events-kafka = ["dep:rdkafka"]

[lib]
name = "ory_console_backend"
path = "src/lib.rs"

[[bin]]
name = "ory-console-backend"
path = "src/main.rs"

[dependencies]
# Pinned per CLAUDE.md (authoritative). Salvo is the operator-mandated web
# framework (override of Axum/Actix) — do NOT switch.
# Feature set (RESEARCH "Installation", corrected against salvo 0.93 feature list):
# cookie (=> __Host- session cookies), rate-limiter (=> per-IP rate limit on
# /setup,/login; MokaStore + FixedGuard ship inside this feature, they are NOT
# separate umbrella features — research assumption A4 was wrong, caught at
# lockfile resolve), affix-state (=> inject PgPool + Config into Depot),
# oapi (=> OpenAPI for the SPA).
salvo = { version = "0.93.0", features = [
    "server",
    "http1",
    "cookie",
    "rate-limiter",
    "affix-state",
    "oapi",
] }
# Shared DTOs the CLI and backend agree on (Phase 19). PURE serde types — pulling
# this in adds NO new transitive deps to the backend graph (it depends only on
# serde/serde_json, already in the tree), so the image-leanness invariant holds.
console-core = { path = "../console-core" }

# `signal` is backend-only (graceful shutdown), so tokio stays an explicit pin
# rather than the workspace one (which omits `signal`); the resolved version is
# unchanged.
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal"] }
# serde matches the workspace pin exactly (1.0.228 + derive) — hoisted to
# `.workspace = true` for version unification with console-core + the future cli.
serde = { workspace = true }
# WR-06: `preserve_order` makes serde_json::Value back an `IndexMap` (insertion
# order) instead of a `BTreeMap` (alphabetical). Without it, the FIRST save of an
# operator's hand-authored kratos.yml/hydra.yml rewrites the whole file in
# alphabetical key order — a noisy diff that destroys the operator's grouping on
# a file they may also hand-edit. With it, the round-trip through yaml.rs
# preserves the original key ORDER of unmanaged keys (comment loss remains, per
# the documented best-effort caveat). serde_yaml_ng serializes via the serde data
# model, so the ordered Value round-trips key order through write-back.
serde_json = { version = "1.0", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- Phase 2: persistence + auth primitives ---------------------------------
# sqlx 0.9 split runtime and TLS into SEPARATE features (Pitfall 3): the runtime
# is `runtime-tokio`, the TLS backend is `tls-rustls` (NOT `runtime-tokio-rustls`).
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "time",
] }
# Argon2id (default()) for console-admin passwords; `std` pulls password-hash + OsRng.
argon2 = { version = "0.5.3", features = ["std"] }
# GitHub OAuth authorization-code exchange (5.0 typestate client; explicit http client).
oauth2 = "5.0.0"
# Explicit async HTTP client for oauth2 5.0 + GitHub user API; rustls (no system
# OpenSSL). reqwest 0.13 renamed the rustls feature `rustls-tls` -> `rustls`.
# reqwest 0.13 matches the workspace pin exactly (default-features=false,
# rustls+json) — hoisted to `.workspace = true` to share the rustls stack with
# the future cli. NOTE: this is the 0.13 fallback client ONLY; the renamed
# `reqwest_012` alias below is a DISTINCT 0.12 major the Ory crates need and is
# deliberately NOT unified (RESEARCH Pitfall 1).
reqwest = { workspace = true }
# CSPRNG for bootstrap/session/CSRF tokens (OsRng); base64url encoding; SHA-256
# (fast hash for the 256-bit session token — NOT Argon2, Pitfall 5); constant-time eq.
rand = "0.10"
base64 = "0.22"
sha2 = "0.10"
subtle = "2.6"
# Primary keys + timestamp columns (matches the sqlx `uuid` + `time` features).
uuid = { version = "1.23", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde"] }
# Typed error enum -> generic JSON (no secret leakage; BACK-07).
thiserror = "2.0"

# --- Phase 3: per-service Ory Admin client crates ---------------------------
# Operator-mandated typed clients, version-locked to the oryd/*:v26.2.0 images.
# These depend on reqwest ^0.12 (DIFFERENT major from the backend's own 0.13
# above) — that is intentional and supported: each crate's `Configuration` owns
# its OWN default reqwest 0.12 client; we never inject the 0.13 client into them
# (RESEARCH Pitfall 1). `default-features = false, features = ["rustls-tls"]`
# avoids the crates' default `native-tls`/OpenSSL, which the rustls-only build
# lacks (RESEARCH Pitfall 3). The 0.13 dep above keeps its distinct `rustls`
# feature name for the fallback module — do NOT unify the two reqwest majors.
ory-kratos-client     = { version = "26.2.0", default-features = false, features = ["rustls-tls"] }
ory-hydra-client      = { version = "26.2.0", default-features = false, features = ["rustls-tls"] }
ory-keto-client       = { version = "26.2.0", default-features = false, features = ["rustls-tls"] }
ory-oathkeeper-client = { version = "26.2.0", default-features = false, features = ["rustls-tls"] }
# WR-01: the Ory `Configuration.client` is a reqwest **0.12** `Client` (a
# DIFFERENT type from the backend's own reqwest 0.13 above). To inject a
# bounded-timeout client into each Configuration we must name that 0.12 type, so
# we add a RENAMED alias of the same 0.12 dep the crates already pull in. Feature
# set matches the Ory crates' `rustls-tls` (no native-tls/OpenSSL) plus `json`.
# This shares the existing 0.12.x resolution — it does NOT add a new major.
reqwest_012 = { package = "reqwest", version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# WR-03: validate the five admin base URLs at startup (parse + reject missing
# scheme/host). `url` is already in the tree transitively (via the Ory crates);
# we depend on it directly for the fail-fast boot check.
url = "2.5"

# --- Phase 4: YAML config-edit subsystem (BACK-04 / BACK-06) -----------------
# Maintained YAML fork (serde_yaml is DEPRECATED/unmaintained — NEVER use it).
# Reads mounted service YAML into serde_json::Value via the serde data model.
serde_yaml_ng = "0.10"
# JSON-Schema (draft-07) validation of the FULL proposed config pre-disk, with a
# custom `Retrieve` to resolve Ory's `ory://` $ref scheme OFFLINE from vendored
# sub-schemas (Pitfall 1 — a naive .build() fails on those refs).
jsonschema = "0.46"
# Atomic write primitive (NamedTempFile in the SAME dir -> sync_all -> persist),
# used by later plans; added now so the engine's deps are in place.
tempfile = "3"

# --- Phase 11: webhook dispatcher (HOOK-01/02/03) ----------------------------
# HOOK-02 HMAC-SHA256 signing of webhook deliveries. PIN 0.12 to match the
# existing direct sha2 0.10 (digest 0.10 traits) — hmac 0.13 targets digest 0.11
# and will NOT type-check against Hmac<Sha256> over the sha2-0.10 Sha256.
hmac = "0.12"
# HOOK-02 SSRF: CIDR containment for any docker-network range beyond the std
# classifiers. Promoted from transitive to direct (already resolved at 2.12).
ipnet = "2.12"
psl = "2"

# --- Phase 14: SAML metadata signing-cert pre-flight (SSO-02 / WR-01) ---------
# --- Phase 16: backend /metrics exporter (OBS-02) ----------------------------
# `metrics` is the instrumentation FACADE; `metrics-exporter-prometheus` renders
# the Prometheus text-exposition format from it. Pinned per 16-RESEARCH
# (Package Legitimacy Audit — both first-party metrics-rs crates, [VERIFIED]
# against crates.io 2026-05): metrics 0.24.6 + exporter 0.18.3 (the exporter
# requires `metrics ^0.24.5`, which 0.24.6 satisfies). NOT the stale ~0.16
# STACK.md figure. The exporter's default features pull `tokio`/`hyper` for a
# push-gateway/HTTP-listener mode we do NOT use — the recorder we build is rendered
# by the EXISTING Salvo `/metrics` handler (scraped container-to-container on the
# internal network), so we disable defaults to keep the surface minimal.
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }

# A real, namespace-aware XML pull-parser for the IdP-metadata signing-cert
# pre-flight. The previous string-scan heuristic (find("keydescriptor") + a
# 20-char close-tag proximity guess) was bypassable by crafted metadata: a
# `use="signing"` token inside an XML COMMENT/CDATA was honored, and an
# encryption-only KeyDescriptor could be misattributed a later bare cert. This
# is the load-bearing forged-assertion defense, so it gets a vetted parser that
# ignores comments/CDATA and evaluates KeyDescriptor/@use structurally. Pinned;
# `default-features = false` (no serde/encoding/async) keeps the surface minimal.
quick-xml = { version = "0.40", default-features = false }

# --- Phase 17: event-stream sink adapters (EVT-01) — OPTIONAL, OFF BY DEFAULT -
# Both pinned + verified live on crates.io 2026-05-26 against their official
# upstream source repos (nats-io/nats.rs, fede1024/rust-rdkafka). `optional = true`
# means a plain `cargo build` / the production image compile NEITHER (see the
# OFF-by-default rationale in the [features] block above). async-nats is pure-Rust
# (rustls/ring). rdkafka needs a C toolchain at build time — isolated to the
# events-kafka feature. The default rdkafka build statically compiles bundled
# librdkafka; `cmake-build` switches to the CMake build system (crate-author
# recommended), `ssl` adds TLS (libssl-dev), `sasl` adds SASL (libsasl2-dev) —
# the common cloud-Kafka shape. Trim ssl/sasl if the first Kafka target is plaintext.
async-nats = { version = "0.49.0", optional = true }
rdkafka = { version = "0.39.0", optional = true, features = ["cmake-build", "ssl", "sasl"] }

[dev-dependencies]
# WR-01: a self-dependency that turns ON the `test-probe` feature whenever the
# crate is compiled for tests (`cargo test`, `cargo test --test feature_flags`).
# Cargo unifies features across the normal + dev dependency graphs at test time,
# so this activates `test-probe` for the lib/bin under test WITHOUT requiring an
# explicit `--features` flag — keeping `cargo test --test feature_flags --locked`
# green — while a plain `cargo build`/`cargo build --release` (no dev-deps) keeps
# the probe compiled OUT of the production binary. This is the canonical Cargo
# idiom for "enable a feature only under test".
ory-console-backend = { path = ".", features = ["test-probe"] }
# Salvo `test` feature exposes TestClient for in-process handler/middleware tests.
salvo = { version = "0.93.0", features = ["test"] }
# In-process mock HTTP server for the restart-broker (204 / non-204) + the
# /health/ready 503-then-200 poll tests, so unit tests need no live Ory stack.
mockito = "1"
# `#[sqlx::test]` provisions an isolated temp database per test (Validation Architecture).
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "time",
] }

# NOTE: the `[profile.release]` block (opt-level "s", lto, codegen-units 1,
# strip) was MOVED to the workspace-root Cargo.toml in Phase 19. Cargo ignores a
# `[profile.*]` block in a non-root workspace member (it warns), so the tuned
# release profile now lives once at the root and applies to this bin unchanged —
# the lean release image is byte-for-byte equivalent to pre-workspace.
