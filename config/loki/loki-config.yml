# =============================================================================
# Loki config (Phase 16, OBS-04) — single-binary, filesystem store, internal-only.
# =============================================================================
# Mounted read-only into the opt-in `observability`-profile Loki
# (grafana/loki:3.7.2). Internal network only — Loki's push (:3100/loki/api/v1/push)
# and query (:3100) surfaces are reachable ONLY from Alloy (push) and the backend/
# Grafana (query) container-to-container; NO host port is published (INFRA-05).
#
# Low-cardinality discipline (T-16-05): the per-stream/series limits below are
# deliberately tight so a high-cardinality label (which must never be emitted by
# Alloy anyway — see config/alloy/config.alloy) cannot quietly explode the index.
# auth is OFF because the whole surface is internal-only and single-tenant.
# =============================================================================

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kind: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Low-cardinality guardrails (T-16-05). A single-tenant console produces a tiny
  # log volume; these bound a runaway label set rather than throughput.
  max_label_names_per_series: 12
  max_label_name_length: 1024
  max_label_value_length: 2048
  # Reject very old / future-dated lines (clock-skew + replay noise).
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Retention: keep two weeks of console logs on the local filesystem store.
  retention_period: 336h
  # Modest ingestion caps for a single-tenant console.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# Disable the usage-report phone-home (BACK-07 posture: no outbound from an
# internal-only service).
analytics:
  reporting_enabled: false
