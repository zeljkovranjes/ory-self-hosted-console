# config/kratos/kratos.yml
#
# Minimal Kratos configuration to reach healthy on first boot.
# Mounted read-only into the container at /etc/config/kratos/ (RESEARCH Pattern 3).
# Verified minimal key set: ory/kratos contrib/quickstart kratos.yml (RESEARCH).
#
# DSN is NOT set here (WR-03): it is the SINGLE responsibility of the `DSN` env
# var that docker-compose injects (built from KRATOS_DB_PASSWORD in .env). Keeping
# a hardcoded `dsn:` here as well created a three-way drift hazard (init SQL +
# this YAML + .env all had to agree) and shipped a password in committed config.
# For all OTHER self-hosted Ory config there is NO live config API — it lives in
# this file and is applied via restart.

serve:
  public:
    base_url: http://kratos:4433/
  admin:
    base_url: http://kratos:4434/

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

selfservice:
  default_browser_return_url: http://localhost:3000/
  flows:
    login:
      ui_url: http://localhost:3000/login
    registration:
      ui_url: http://localhost:3000/registration
    settings:
      ui_url: http://localhost:3000/settings
    error:
      ui_url: http://localhost:3000/error
    recovery:
      ui_url: http://localhost:3000/recovery
    verification:
      ui_url: http://localhost:3000/verification

secrets:
  # PLACEHOLDER 32-char values — Plan 04 overrides via env/.env. Do NOT use in production.
  cookie:
    - PLACEHOLDERcookieSECRET0123456789AB
  cipher:
    # cipher MUST be exactly 32 characters
    - PLACEHOLDERcipherSECRET0123456AB
