# =============================================================================
# Grafana dashboard provider (Phase 16, OBS-03/OBS-05) — dashboards-as-code.
# =============================================================================
# Loads every dashboard JSON under /var/lib/grafana/dashboards (the mounted
# config/grafana/dashboards dir) at boot. Internal-only; surfaced via the authed
# backend proxy in plan 16-02.
# =============================================================================
apiVersion: 1

providers:
  - name: observability
    orgId: 1
    folder: Observability
    type: file
    disableDeletion: false
    editable: false
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
