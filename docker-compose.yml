# docker-compose.yml
# =============================================================================
# Ory Self-Hosted Console — full stack orchestration (Phase 1 convergence).
#
# A single `docker compose up -d --wait` on a FRESH volume brings up:
#   - postgres (creates 5 DBs on first boot via db/init)
#   - kratos / hydra / keto migrate one-shots (gated on postgres healthy)
#   - kratos / hydra / keto / oathkeeper long-lived Ory services (distroless)
#   - restart-broker (wollomatic/socket-proxy — sole Docker-socket holder)
#   - backend (Rust/Salvo skeleton) + frontend (Next.js skeleton)
#
# Security topology (Phase 1 deliverable):
#   - Two networks: `internal` (internal: true, NO host route) carries Postgres,
#     all Ory Admin/public APIs, and the broker; `edge` carries only the two
#     host-published services (backend, frontend).
#   - NO Ory admin OR public port is published to the host (INFRA-05).
#   - config/ mounted :ro into every Ory container, :rw into the backend only
#     (INFRA-07) — tamper-resistance for the Phase 4 YAML-edit subsystem.
#   - The backend holds NO Docker socket; it reaches the engine ONLY through the
#     scoped restart-broker (BACK-05).
#
# Compose v2: the obsolete top-level `version:` key is intentionally OMITTED.
#
# -----------------------------------------------------------------------------
# PER-SERVICE PROFILES — selective Ory services (CLI-builder, COMPOSE-PROFILES).
# -----------------------------------------------------------------------------
# Each of the five Ory services (+ its migrate one-shot) carries a profile named
# after the service so the operator/wizard can EXCLUDE one by dropping its
# profile from COMPOSE_PROFILES:
#   svc-kratos      -> kratos      + kratos-migrate
#   svc-hydra       -> hydra       + hydra-migrate
#   svc-keto        -> keto        + keto-migrate
#   svc-oathkeeper  -> oathkeeper  + oathkeeper-jwks-init
#   svc-polis       -> polis
# Postgres + backend + frontend (+ account-experience) carry NO profile and are
# ALWAYS started.
#
# Compose does NOT start a profiled service unless its profile is active, so to
# keep the DEFAULT "all five Ory services on" posture UNCHANGED, COMPOSE_PROFILES
# DEFAULTS to all five svc-* profiles. The committed `.env`/`.env.example` set:
#   COMPOSE_PROFILES=svc-kratos,svc-hydra,svc-keto,svc-oathkeeper,svc-polis
# so a plain `docker compose up -d --wait` brings up the full stack exactly as
# before. The CLI-builder wizard rewrites COMPOSE_PROFILES to DROP a service's
# svc-* profile when that service is selected `off` (and the backend's env-driven
# boot reconcile cascade-disables that service's console feature flag). This is
# the deterministic, INFRA-04-safe switch — no generated override file, and the
# x-images anchors / image literals are untouched (the grep still counts 4).
# =============================================================================

# -----------------------------------------------------------------------------
# Image pins (single source of truth — INFRA-04).
# Each Ory image literal appears EXACTLY ONCE here and is referenced by YAML
# alias from both the migrate one-shot and the long-lived service, so a fresh
# `grep -E 'oryd/(kratos|hydra|keto|oathkeeper):v26.2.0-distroless'` counts
# exactly 4 (the acceptance harness asserts == 4). Every image is tag-pinned;
# no floating/rolling tags are used anywhere in this file.
# -----------------------------------------------------------------------------
x-images:
  kratos-image: &kratos-image oryd/kratos:v26.2.0-distroless
  hydra-image: &hydra-image oryd/hydra:v26.2.0-distroless
  keto-image: &keto-image oryd/keto:v26.2.0-distroless
  oathkeeper-image: &oathkeeper-image oryd/oathkeeper:v26.2.0-distroless
  # Non-distroless Oathkeeper (same v26.2.0 release, with a shell) used ONLY by
  # the oathkeeper-jwks-init one-shot to generate the id_token signing JWKS at
  # first boot (CR-01). It is NOT a long-lived service and is intentionally the
  # non-distroless tag so the `-distroless` INFRA-04 pin grep still counts == 4.
  oathkeeper-tools-image: &oathkeeper-tools-image oryd/oathkeeper:v26.2.0
  # Phase 16 observability-profile image pins (INFRA-04 — exact tags, no :latest).
  # These four are NOT part of the Ory v26.2.0 lockstep; they track Grafana Labs /
  # Prometheus releases and are re-pinned at compose-author time (16-RESEARCH,
  # [VERIFIED] against the registries 2026-05). They start ONLY under
  # `--profile observability`.
  prometheus-image: &prometheus-image prom/prometheus:v3.11.3
  # Grafana: the plain `13.1.0` tag is NOT published on Docker Hub (only
  # build-suffixed `13.1.0-<build>` variants + the explicit security-patched
  # `13.0.1-security-01`). Per 16-RESEARCH's tag-pin discipline ("pick the highest
  # PATCHED tag"), pin the security-patched stable tag — verified to resolve via
  # `docker manifest inspect` at execution (A5 resolved).
  grafana-image: &grafana-image grafana/grafana:13.0.1-security-01
  loki-image: &loki-image grafana/loki:3.7.2
  alloy-image: &alloy-image grafana/alloy:v1.16.1

# -----------------------------------------------------------------------------
# Networks (Pattern 1 — two-network isolation)
# -----------------------------------------------------------------------------
networks:
  internal:
    # internal: true => Docker creates NO gateway to the host/internet. Combined
    # with publishing no ports, the Ory Admin APIs are unreachable from the host.
    internal: true
    # WR-05 (Grafana auth-proxy spoof defense-in-depth): a FIXED subnet so the
    # backend can hold a STATIC internal IP (172.30.0.10). Grafana's
    # GF_AUTH_PROXY_WHITELIST is pinned to exactly that IP, so it honors the
    # X-WEBAUTH-USER auth-proxy header ONLY from the backend — not from any other
    # compromised peer on this shared network (Postgres/Ory/broker/Loki/etc.). The
    # /24 is a private range outside Docker's default 172.17-31 pools to avoid
    # collisions; adjust only if it clashes with an existing host network.
    ipam:
      config:
        - subnet: 172.30.0.0/24
  edge:
    driver: bridge
  # ax-public (Phase 15, INFRA-05 / threat T-15-01): a DEDICATED internal segment
  # carrying ONLY the Account Experience service and Kratos. It exists so the AX
  # can reach Kratos PUBLIC :4433 server-side WITHOUT being placed on the broad
  # `internal` network (where Hydra/Keto/Oathkeeper ADMIN ports also live). Because
  # the AX is NOT on `internal`, it has NO route to those three services' admin
  # ports at all — the live gate asserts each is refused from the AX container.
  # `internal: true` keeps this segment off the host gateway too.
  #
  # RESIDUAL (documented, accepted — mirrors the Hydra --dev residual posture):
  # Kratos serves both its PUBLIC :4433 and ADMIN :4434 on every interface it
  # binds (0.0.0.0), so a peer sharing ANY network with Kratos can reach :4434.
  # Plain compose has no port-level ACL between containers on a shared network.
  # The AX is given ONLY the public URL (no admin env) and never calls :4434; the
  # host-level INFRA-05 invariant (no admin port host-published) is unaffected.
  # Fully closing the Kratos public/admin co-listening gap requires an L7
  # public-only proxy in front of Kratos — tracked as a hardening follow-up.
  ax-public:
    internal: true

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres-data:
  # Holds the Oathkeeper id_token signing JWKS, GENERATED at first boot by the
  # oathkeeper-jwks-init one-shot (CR-01 — no private key is committed to git).
  # Destroying this volume (`docker compose down -v`) rotates the key on next up.
  oathkeeper-secrets:
  # Phase 16: Prometheus TSDB + Loki chunk/index store for the opt-in
  # observability profile. Only created/used when `--profile observability` is up.
  prometheus-data:
  loki-data:

# -----------------------------------------------------------------------------
# Secrets (Phase 16, OBS-05) — Grafana admin password file.
# -----------------------------------------------------------------------------
# Used ONLY by the observability-profile Grafana service. The operator copies
# secrets/grafana_admin_password.example -> secrets/grafana_admin_password (see
# secrets/README.md). A plain `docker compose up` does not reference this secret
# (Grafana is profiled), so the file's absence does not affect the base stack.
secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password

services:
  # ===========================================================================
  # Postgres — owns all five logical databases. HAS a shell + pg_isready, so a
  # normal healthcheck works here (unlike the distroless Ory images).
  # ===========================================================================
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    # CLI-builder BYO-Postgres (IUX-BYO-PG-02): the in-stack DB + its ./db/init
    # mount only start when `svc-postgres` is active (the default COMPOSE_PROFILES
    # includes it, so a plain `docker compose up` is unchanged). A bring-your-own
    # build drops svc-postgres → this container never starts and the 8 DSNs point
    # at ${POSTGRES_HOST}. The four `postgres:` depends_on edges carry
    # `required: false` so `--wait` does not wedge on the absent dependency.
    profiles: ["svc-postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # POSTGRES_DB intentionally unset: db/init/01-init.sql creates the 5 DBs.
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # First-boot init: runs ONLY on an empty data dir (Pitfall 2). Read-only.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ory}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [internal]
    # NO host ports — Postgres is internal-only.

  # ===========================================================================
  # Migrate one-shots (Pattern 4 — completion-gated ordering).
  # Each gates on postgres: service_healthy, runs its service's migrate command,
  # and exits 0. restart: "no" so service_completed_successfully fires cleanly
  # (Pitfall 4). NOTE the per-service flag differences (RESEARCH Migration table):
  #   Kratos / Hydra: `migrate sql -e --yes` (-e reads DSN env)
  #   Keto:           `migrate up -c <config> --yes` (NO -e; DSN from env/config)
  #   Oathkeeper:     NONE — stateless, no migrate container.
  # ===========================================================================
  kratos-migrate:
    image: *kratos-image
    container_name: kratos-migrate
    profiles: ["svc-kratos"]
    command: ["migrate", "sql", "-e", "--yes"]
    environment:
      DSN: postgres://kratos:${KRATOS_DB_PASSWORD:?set KRATOS_DB_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/kratos?sslmode=${POSTGRES_SSLMODE:-disable}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: "no"
    networks: [internal]

  hydra-migrate:
    image: *hydra-image
    container_name: hydra-migrate
    profiles: ["svc-hydra"]
    command: ["migrate", "sql", "-e", "--yes"]
    environment:
      DSN: postgres://hydra:${HYDRA_DB_PASSWORD:?set HYDRA_DB_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/hydra?sslmode=${POSTGRES_SSLMODE:-disable}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: "no"
    networks: [internal]

  keto-migrate:
    image: *keto-image
    container_name: keto-migrate
    profiles: ["svc-keto"]
    # Keto: `migrate up`, NO -e flag; DSN from the DSN env var.
    command: ["migrate", "up", "-c", "/etc/config/keto/keto.yml", "--yes"]
    environment:
      DSN: postgres://keto:${KETO_DB_PASSWORD:?set KETO_DB_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/keto?sslmode=${POSTGRES_SSLMODE:-disable}
    volumes:
      - ./config/keto:/etc/config/keto:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: "no"
    networks: [internal]

  # ===========================================================================
  # Long-lived Ory services (distroless). container_name: ory-<svc> so the
  # broker allowlist (Task 2) scopes exactly to these names.
  # Each mounts ONLY its own config dir, read-only (INFRA-07). NO host ports.
  # Healthchecks: Kratos uses in-image `kratos remote status`; Hydra/Keto/
  # Oathkeeper readiness is gated via curl sidecars added in Task 2 (their
  # `depends_on: <svc>-health: service_healthy` is wired in Task 2).
  # ===========================================================================
  kratos:
    image: *kratos-image
    container_name: ory-kratos
    profiles: ["svc-kratos"]
    # --watch-courier: run the mail courier IN-PROCESS so recovery/verification
    # (and any other) emails queued by Kratos are actually dispatched to SMTP
    # (the Mailpit catcher below in dev; a real SMTP server in prod). Without it,
    # messages persist to the courier queue but are never sent.
    command: ["serve", "--config", "/etc/config/kratos/kratos.yml", "--watch-courier"]
    environment:
      DSN: postgres://kratos:${KRATOS_DB_PASSWORD:?set KRATOS_DB_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/kratos?sslmode=${POSTGRES_SSLMODE:-disable}
    volumes:
      - ./config/kratos:/etc/config/kratos:ro
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    healthcheck:
      # Distroless: no shell/curl, but the kratos binary ships `remote status`,
      # which probes /health/alive + /health/ready via the admin endpoint.
      test: ["CMD", "kratos", "remote", "status", "--endpoint", "http://127.0.0.1:4434"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # internal: the backend + other Ory services reach Kratos here.
    # ax-public: the Account Experience reaches Kratos PUBLIC :4433 here WITHOUT
    # being on `internal` (Phase 15, INFRA-05 / T-15-01 — see networks: ax-public).
    networks: [internal, ax-public]

  # ===========================================================================
  # DEV-MAIL PROFILE (mailpit + sms-sink) — opt-in, DEFAULT OFF.
  # ===========================================================================
  # Both catchers are gated behind `profiles: ["dev-mail"]` (the observability-
  # /acceptance-profile precedent): a plain `docker compose up` does NOT start
  # them; `docker compose --profile dev-mail up` does. This keeps the unencrypted,
  # non-forwarding dev catchers out of a production stack. NO base-stack service
  # `depends_on` mailpit or sms-sink — Kratos reaches them at SEND time, never at
  # boot — so gating them is safe. The committed kratos.yml courier block still
  # points at `mailpit:1025` / `sms-sink:8080` as the documented dev default;
  # production operators leave this profile OFF and point Kratos at a real SMTP
  # server / SMS gateway via the console Email/SMTP + SMS pages.
  # ---------------------------------------------------------------------------
  # Mailpit — DEV mail catcher (SMTP sink + web UI). Runs ONLY under
  # `--profile dev-mail` (default OFF).
  #
  # Captures every email Kratos's courier sends (recovery, verification, etc.) so
  # the self-hosted console works end-to-end WITHOUT a real mail provider when the
  # dev-mail profile is up. SMTP :1025 stays on the internal network (Kratos
  # reaches it as `mailpit:1025`); the web UI :8025 is host-published so the
  # operator can read the captured messages (recovery codes/links) at
  # http://localhost:8025 — but only while the profile is up.
  #
  # NOT a production mail server: it neither encrypts nor forwards. For real
  # delivery the operator leaves this profile off and points Kratos at an external
  # SMTP server via the console Email/SMTP page (it rewrites courier.smtp in
  # kratos.yml + restarts Kratos). MP_SMTP_AUTH_ACCEPT_ANY + _ALLOW_INSECURE let
  # Kratos send over plain SMTP with no credentials (matching
  # `smtp://mailpit:1025/?disable_starttls=true`).
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: mailpit
    profiles: ["dev-mail"]
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    # internal: Kratos (also on internal) reaches SMTP :1025 here.
    # edge: carries the host-published web UI :8025 (internal:true has no host
    # gateway, so the UI port must ride the bridge network).
    networks: [internal, edge]

  # ===========================================================================
  # SMS sink — DEV "SMS catcher" (the SMS analog of the Mailpit mail catcher).
  # Runs ONLY under `--profile dev-mail` (default OFF).
  #
  # Kratos has no built-in SMS provider; it sends SMS by POSTing to an HTTP
  # gateway (courier.channels[sms] in kratos.yml). With no real provider there is
  # nothing to send to, so this tiny zero-dependency Node service stands in as the
  # gateway: it captures Kratos's SMS POSTs and serves a web UI + JSON API so the
  # operator can READ the codes (the dev equivalent of opening Mailpit) at
  # http://localhost:8026 — but only while the dev-mail profile is up. NOT a real
  # SMS provider — production leaves this profile off and points Kratos at a real
  # gateway via the console SMS page. The server is mounted (no image build).
  sms-sink:
    image: node:24-slim
    container_name: sms-sink
    profiles: ["dev-mail"]
    restart: unless-stopped
    command: ["node", "/app/server.js"]
    environment:
      PORT: "8080"
    volumes:
      - ./docker/sms-sink:/app:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "${SMS_SINK_PORT:-8026}:8080"
    # internal: Kratos (also on internal) reaches the gateway at sms-sink:8080.
    # edge: carries the host-published web UI (internal:true has no host gateway).
    networks: [internal, edge]

  # NOTE on Hydra/Keto/Oathkeeper healthchecks (Pitfall 1 — distroless has no
  # shell/curl, and only Kratos ships an in-image `remote status`): each of these
  # three services is built from a thin wrapper (docker/ory-healthcheck/Dockerfile)
  # that vendors ONE static curl binary into the pinned distroless base, so the
  # SERVICE CONTAINER ITSELF carries an in-image HEALTHCHECK curling its own
  # /health endpoint over loopback. This makes `docker compose up --wait` gate on
  # each service AND lets the acceptance harness assert `healthy` on the service
  # container directly (no separate sidecar). The BASE_IMAGE build-arg is passed
  # via the YAML image anchor so the pinned tag literal still appears exactly four
  # times in this file (INFRA-04 grep gate). Distroless hardening is preserved:
  # one static binary added, still no shell / package manager, non-root.
  hydra:
    build:
      context: ./docker/ory-healthcheck
      args:
        BASE_IMAGE: *hydra-image
    container_name: ory-hydra
    profiles: ["svc-hydra"]
    # --dev: serves Hydra over plain HTTP on the internal-only network (no public
    # port is published; TLS termination is a reverse-proxy concern out of scope
    # here). Without --dev, Hydra refuses a non-HTTPS `urls.self.issuer`.
    #
    # Phase-8 decision (T-08-DEV): --dev is RETAINED and the residual risk is
    # documented + accepted in README.md ("Hydra boot mode — --dev residual risk").
    # Justified by INFRA-05 — Hydra's public/admin ports are NEVER host-published,
    # so the relaxed transport posture has no externally reachable surface.
    # SECRETS_SYSTEM (encryption-at-rest, immutable) and DSN below are preserved.
    # To go fully production-mode: terminate TLS at a reverse proxy, set an https
    # `urls.self.issuer` (editable on the OAuth2 General page), then drop --dev.
    command: ["serve", "all", "--dev", "--config", "/etc/config/hydra/hydra.yml"]
    environment:
      DSN: postgres://hydra:${HYDRA_DB_PASSWORD:?set HYDRA_DB_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/hydra?sslmode=${POSTGRES_SSLMODE:-disable}
      SECRETS_SYSTEM: ${HYDRA_SECRETS_SYSTEM:?set HYDRA_SECRETS_SYSTEM (immutable after first migration)}
    volumes:
      - ./config/hydra:/etc/config/hydra:ro
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    healthcheck:
      # Hydra admin /health/ready on 4445 (returns 200 once ready).
      test: ["CMD", "/usr/local/bin/curl", "-sf", "http://127.0.0.1:4445/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 25s
    networks: [internal]

  keto:
    build:
      context: ./docker/ory-healthcheck
      args:
        BASE_IMAGE: *keto-image
    container_name: ory-keto
    profiles: ["svc-keto"]
    command: ["serve", "-c", "/etc/config/keto/keto.yml"]
    environment:
      DSN: postgres://keto:${KETO_DB_PASSWORD:?set KETO_DB_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/keto?sslmode=${POSTGRES_SSLMODE:-disable}
    volumes:
      - ./config/keto:/etc/config/keto:ro
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    healthcheck:
      # Keto metadata/health port is 4469 (returns 200 once ready).
      test: ["CMD", "/usr/local/bin/curl", "-sf", "http://127.0.0.1:4469/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 25s
    networks: [internal]

  # ---------------------------------------------------------------------------
  # Oathkeeper JWKS init (one-shot — CR-01). Generates the id_token signing JWKS
  # into the `oathkeeper-secrets` volume on first boot ONLY if it does not yet
  # exist, so NO private key is ever committed to git. Idempotent across restarts
  # (the volume persists the key); `docker compose down -v` rotates it. Uses the
  # non-distroless oathkeeper image (has a shell for the stdout redirect). Runs
  # `restart: "no"` so `service_completed_successfully` gates the oathkeeper svc.
  # ---------------------------------------------------------------------------
  oathkeeper-jwks-init:
    image: *oathkeeper-tools-image
    container_name: oathkeeper-jwks-init
    profiles: ["svc-oathkeeper"]
    # Runs as root ONLY to create the key file in the fresh (root-owned) volume,
    # then hands it to Oathkeeper read-only. The long-lived oathkeeper service
    # mounts the volume :ro and runs as its own non-root user. This one-shot has
    # NO socket, NO host port, and exits immediately, so the elevated uid is
    # short-lived and tightly scoped to writing one file.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -s /etc/secrets/oathkeeper/jwks.json ]; then
          echo "JWKS already present — keeping existing key (no rotation)."
        else
          echo "Generating Oathkeeper id_token JWKS (RS256) into volume..."
          oathkeeper credentials generate --alg RS256 --kid oathkeeper-id-token > /etc/secrets/oathkeeper/jwks.json
          # World-readable so the non-root oathkeeper user can read it (the file
          # is the SIGNING key; it lives only inside the internal-only volume).
          chmod 0644 /etc/secrets/oathkeeper/jwks.json
          echo "JWKS generated."
        fi
    volumes:
      - oathkeeper-secrets:/etc/secrets/oathkeeper
    restart: "no"
    networks: [internal]

  oathkeeper:
    build:
      context: ./docker/ory-healthcheck
      args:
        BASE_IMAGE: *oathkeeper-image
    container_name: ory-oathkeeper
    profiles: ["svc-oathkeeper"]
    # Stateless: no DB, no migrate dependency — serve only.
    command: ["serve", "--config", "/etc/config/oathkeeper/config.yaml"]
    volumes:
      - ./config/oathkeeper:/etc/config/oathkeeper:ro
      # Generated id_token JWKS, read-only (CR-01). The init one-shot owns writes.
      - oathkeeper-secrets:/etc/secrets/oathkeeper:ro
    depends_on:
      oathkeeper-jwks-init:
        condition: service_completed_successfully
    healthcheck:
      # Oathkeeper api/health port is 4456. NOTE: unlike Hydra/Keto, Oathkeeper's
      # /health/ready returns 503 ("resource could not be found") for this
      # stateless, empty-ruleset configuration — its readiness reporter has no
      # satisfiable dependency to report on. /health/alive (200) is the meaningful
      # liveness signal for a from-file stateless service. Real access rules arrive
      # in Phase 9; revisit /health/ready then.
      test: ["CMD", "/usr/local/bin/curl", "-sf", "http://127.0.0.1:4456/health/alive"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 25s
    networks: [internal]

  # ===========================================================================
  # SECURITY-CRITICAL LAYER (Task 2)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Restart broker (Pattern 2 — wollomatic/socket-proxy, BACK-05).
  # The SOLE container mounting the Docker socket (read-only). Secure-by-default:
  # only the explicitly-allowed verb+path passes. Allowlist is scoped to a
  # POST .../restart of exactly the four ory-* containers, callable only from
  # the backend container. Listens on 0.0.0.0 (internal net only) because the
  # backend is a separate container (Pitfall 5); no host port is published.
  # ---------------------------------------------------------------------------
  restart-broker:
    image: wollomatic/socket-proxy:1.12.1
    container_name: restart-broker
    # Run as a non-root uid (nobody) but in the root GROUP (gid 0) so the process
    # can read the Docker socket, which is owned root:root mode srw-rw---- on
    # Docker Desktop/WSL2 (group-readable). This keeps the broker process
    # non-root while granting only the group access the socket actually needs;
    # combined with read_only + no-new-privileges + the scoped allowlist it
    # stays least-privilege. (On a host whose socket has a different group, set
    # the gid to match that group instead.)
    user: "65534:0"
    command:
      - "-loglevel=info"
      - "-listenip=0.0.0.0"
      - "-allowfrom=backend"
      # Enable the proxy's built-in HEAD /health on localhost:55555 so the
      # container can self-report healthy (the image bundles a /healthcheck
      # binary that probes it). This does NOT widen the Docker-API allowlist —
      # it is a separate internal health endpoint, not a proxied socket route.
      - "-allowhealthcheck"
      # Allow an OPTIONAL query string after /restart (CR-02). The Docker Engine
      # restart endpoint is normally called with `?t=<seconds>` (graceful stop
      # timeout) and, on newer engines, `?signal=`. wollomatic auto-anchors with
      # ^...$, so without `(\?.*)?` a real `.../restart?t=10` call is denied 403.
      # Still scoped to ONLY the allowed containers + the restart verb.
      # Phase 13 (BACK-05): `polis` appended to the container-name group ONLY —
      # the verb (/restart) and path scope are unchanged. The backend still holds
      # NO Docker socket; restarting Polis goes through this scoped allowlist.
      - '-allowPOST=/v1\..{1,2}/containers/(ory-kratos|ory-hydra|ory-keto|ory-oathkeeper|polis)/restart(\?.*)?'
    volumes:
      # ONLY container with the socket — mounted read-only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      # Bundled helper binary probes HEAD http://localhost:55555/health.
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks: [internal]
    # NO host ports — reachable only from the backend over the internal network.

  # ===========================================================================
  # Backend (Rust/Salvo skeleton). Dual-homed: `internal` to reach Ory + broker,
  # `edge` to publish to host. config/ mounted :rw (INFRA-07). NO Docker socket
  # (BACK-05) — it talks to the engine only via restart-broker. (Task 2 adds the
  # no-new-privileges hardening.)
  # ===========================================================================
  backend:
    build:
      # WORKSPACE LAYOUT (Phase 19 / Plan 01 note): the repo root is now a Cargo
      # workspace (console-core + backend + cli). The backend Dockerfile's build
      # context MUST be the REPO ROOT so a `--locked` build sees the workspace-root
      # Cargo.toml + the single root Cargo.lock + the console-core crate. Only
      # `-p ory-console-backend` is built, so clap/the CLI never enter this image
      # (leanness invariant — `cargo tree -p ory-console-backend` has no clap).
      context: .
      dockerfile: backend/Dockerfile
      args:
        # WR-01: OFF by default — a normal `docker compose up` builds the hardened
        # production backend with NO `/api/features/_probe` keystone probe. The
        # live acceptance gate (scripts/verify/phase12-acceptance.sh) exports
        # TEST_PROBE=1 so its ephemeral image DOES expose the probe to anchor
        # FLAG-01 end-to-end. Mirrors the OFF-by-default acceptance-only posture of
        # WEBHOOK_ALLOW_PRIVATE_TARGETS. NEVER set this for a production build.
        TEST_PROBE: ${TEST_PROBE:-}
    container_name: backend
    environment:
      BACKEND_BIND_ADDR: 0.0.0.0:8080
      # Single Ory base URL + admin credential bootstrap contract (INFRA-06).
      ORY_BASE_URL: ${ORY_BASE_URL:-http://oathkeeper:4455}
      # CLI-builder (SVC-SELECT / CASCADE): the per-service selection mode the
      # backend reads at boot (features::service_seed::reconcile_service_flags).
      # Each defaults to `in-stack` (feature ON). Set one to `off` (and drop its
      # svc-* profile from COMPOSE_PROFILES) to cascade-disable that service's
      # console feature SERVER-SIDE (route 404 + nav hidden); `byo` keeps the
      # feature ON and points the matching *_ADMIN_URL at an external instance.
      # The wizard rewrites these in .env; only `off` ever forces a flag off.
      CONSOLE_SERVICE_KRATOS: ${CONSOLE_SERVICE_KRATOS:-in-stack}
      CONSOLE_SERVICE_HYDRA: ${CONSOLE_SERVICE_HYDRA:-in-stack}
      CONSOLE_SERVICE_KETO: ${CONSOLE_SERVICE_KETO:-in-stack}
      CONSOLE_SERVICE_OATHKEEPER: ${CONSOLE_SERVICE_OATHKEEPER:-in-stack}
      CONSOLE_SERVICE_POLIS: ${CONSOLE_SERVICE_POLIS:-in-stack}
      # Phase 3 (BACK-02 / INFRA-05): per-service Ory ADMIN base URLs. Internal
      # service-name DNS on the `internal` network ONLY — these admin ports are
      # never host-published (no `ports:` entry on the Ory services). They carry
      # no credential; the backend is the sole client of these endpoints.
      KRATOS_ADMIN_URL: http://kratos:4434
      HYDRA_ADMIN_URL: http://hydra:4445
      # Hydra PUBLIC port — token revoke (/oauth2/revoke) is a public-API
      # endpoint, NOT admin. Internal-only DNS; never host-published (INFRA-05).
      HYDRA_PUBLIC_URL: http://hydra:4444
      KETO_READ_URL: http://keto:4466
      KETO_WRITE_URL: http://keto:4467
      # PERM-01: Keto serves its OPL syntax-check API on a THIRD port (:4469),
      # distinct from read (:4466) and write (:4467). Used by the Permission-Model
      # editor's pre-save validate. Already reachable internally (the Keto
      # healthcheck + Phase-4 health-poll hit :4469); no new published port.
      KETO_OPL_URL: http://keto:4469
      OATHKEEPER_API_URL: http://oathkeeper:4456
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      # Console session-cookie posture (CAUTH-05 / IN-04). Hardened by DEFAULT:
      # both fall through to the backend's secure-by-default behavior when unset.
      #   - CONSOLE_INSECURE_COOKIES (default false): keep UNSET in production so
      #     the session cookie carries the `__Host-` prefix + `Secure`. Set it to
      #     `true` ONLY for a plain-HTTP localhost bring-up where a BROWSER must
      #     keep the cookie (a `__Host-`/`Secure` cookie is silently dropped over
      #     http://localhost), e.g. the Phase-5 Playwright auth e2e. The Phase-5
      #     acceptance gate exports it for the duration of its ephemeral run only.
      #   - CONSOLE_ALLOWED_ORIGINS: comma-separated pre-session Origin allowlist
      #     for /setup + /login. The frontend talks to the backend SAME-ORIGIN via
      #     the Next /backend rewrite, so a browser request carries no cross-site
      #     Origin; set this to your console origin(s) for defense-in-depth.
      CONSOLE_INSECURE_COOKIES: ${CONSOLE_INSECURE_COOKIES:-}
      CONSOLE_ALLOWED_ORIGINS: ${CONSOLE_ALLOWED_ORIGINS:-}
      # Phase 11 (HOOK-01/02) — TEST/CI-ONLY webhook-worker SSRF relaxation.
      # DEFAULT EMPTY (false): in production the webhook worker fully enforces the
      # SSRF classifier (private/loopback/metadata targets are blocked). The live
      # acceptance gate (scripts/verify/phase11-acceptance.sh) sets this to `true`
      # for its ephemeral run so the worker can deliver to the internal `echo-
      # receiver` sidecar (an RFC1918 docker address the guard would otherwise
      # block). It is DOUBLE-GATED in the backend: honored ONLY when
      # CONSOLE_INSECURE_COOKIES is ALSO set (the dev/acceptance posture) — so even
      # if accidentally set in production it is ignored. The DNS resolve + pin
      # (TOCTOU) + redirects-off hardening apply regardless. NEVER set this in prod.
      WEBHOOK_ALLOW_PRIVATE_TARGETS: ${WEBHOOK_ALLOW_PRIVATE_TARGETS:-}
      # Backend reaches the Docker engine ONLY through the scoped broker.
      RESTART_BROKER_URL: http://restart-broker:2375
      # Phase 16 (OBS-03/04/05): the opt-in observability-profile internal base
      # URLs. The backend is the SOLE client (BACK-01) — the frontend never
      # reaches Prometheus/Loki/Grafana directly. Internal service-name DNS on the
      # `internal` network ONLY; none of the three publishes a host port
      # (INFRA-05). Server-defined (never client input — no SSRF surface). These
      # resolve only when the `observability` profile is up; when it is down the
      # backend's tolerant health-probe returns profile_not_running (never a 502).
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      GRAFANA_URL: http://grafana:3000
      # Phase 14 (SSO-02/03/04): the backend is the SOLE client of the Polis admin
      # API. POLIS_ADMIN_URL is the INTERNAL admin/OIDC base (never host-published,
      # INFRA-05). POLIS_API_KEY is the write-only `Authorization: Api-Key`
      # credential (== the Polis container's API_KEYS) — BACK-07: never logged or
      # returned to the frontend. POLIS_EXTERNAL_URL is the single public OIDC
      # issuer the generated Kratos generic-provider entry points at (split-horizon
      # Pattern A — identical for the browser and Kratos server-side).
      POLIS_ADMIN_URL: http://polis:5225
      POLIS_API_KEY: ${POLIS_API_KEY:?set POLIS_API_KEY}
      POLIS_EXTERNAL_URL: ${POLIS_EXTERNAL_URL:?set POLIS_EXTERNAL_URL}
      # Backend's own state DB (Phase 2 owns the schema).
      DATABASE_URL: postgres://console:${CONSOLE_DB_PASSWORD:?set CONSOLE_DB_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/console?sslmode=${POSTGRES_SSLMODE:-disable}
    volumes:
      # Read-WRITE config mount (the ONLY rw config mount) — Phase 4 edit subsystem.
      - ./config:/etc/config:rw
    depends_on:
      # CLI-builder (COMPOSE-PROFILES / T-CB-A04): the four Ory deps are now
      # CROSS-PROFILE with `required: false` (compose v2.20.2+, the same form
      # grafana/alloy use). When a service's svc-* profile IS active, `--wait`
      # still gates the backend on that service's in-image healthcheck — so a
      # full `up -d --wait` genuinely means every present Ory service is healthy
      # before the backend (and the harness) probe them. When a profile is
      # OMITTED (the service is `off`), the dep is simply skipped: the backend
      # comes up healthy with ZERO Ory services and `--wait` does NOT hang on the
      # absent dependency. The backend's env-driven boot reconcile then
      # cascade-disables the off service's console feature flag (404 + nav hide).
      kratos:
        condition: service_healthy
        required: false
      hydra:
        condition: service_healthy
        required: false
      keto:
        condition: service_healthy
        required: false
      oathkeeper:
        condition: service_healthy
        required: false
      restart-broker:
        condition: service_started
    healthcheck:
      # Backend image vendors a static curl (see backend/Dockerfile) so it can
      # both self-healthcheck and serve as the harness's internal probe source.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Container hardening (BACK-05 / V14): no privilege escalation. The backend
    # mounts NO Docker socket — it reaches the engine only via restart-broker.
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      internal:
        # WR-05: a STATIC internal IP so Grafana's GF_AUTH_PROXY_WHITELIST can pin
        # the trusted X-WEBAUTH-USER source to EXACTLY the backend. Docker assigns
        # dynamic IPs by default, which a whitelist cannot target — fixing it here
        # is what lets the whitelist be authoritative (defense-in-depth: a
        # compromised peer cannot forge the auth-proxy header from a different IP).
        ipv4_address: 172.30.0.10
      edge: {}

  # ===========================================================================
  # Operator CLI (Phase 19, CLI-02..06) — OPTIONAL, one-shot, internal-only.
  #
  # The `console-cli` image (cli/Dockerfile) built from the workspace root. It is
  # a SEPARATE, tiny image from the backend so the backend runtime stays lean (no
  # clap/CLI code in it — LOCKED constraint). The CLI never talks to Ory/the DB
  # directly: ONLINE commands are HTTP clients of the EXISTING backend routes via
  # `Authorization: Api-Key <raw>` (never a second writer); BOOTSTRAP commands
  # write only gitignored `.env`/secret files.
  #
  # OPTIONALITY (CLI-02 / T-19-16): this service carries `profiles: ["cli"]`, so a
  # plain `docker compose up` (and `up -d --wait`) NEVER starts it — the full stack
  # + every feature comes up without it. NO base-stack service has a `depends_on`
  # pointing at `cli`. It is invoked one-shot:
  #
  #   docker compose run --rm cli feature enable saml
  #   docker compose run --rm cli feature list
  #   docker compose run --rm cli observability on
  #
  # INFRA-05 / T-19-15: attached to the INTERNAL network ONLY, with NO `ports:` —
  # it reaches `backend:8080` container-to-container and publishes no host port.
  #
  # SECRETS: `CONSOLE_API_KEY` is passed via the environment / `.env` (NEVER a
  # literal here, NEVER on argv). For BOOTSTRAP commands that write `./.env`, run
  # the cli with the repo root bind-mounted, e.g.:
  #   docker compose run --rm -v "$PWD:/work" cli oauth github set
  # (the secret VALUE itself comes from an env var / --*-file / prompt — see README).
  # ===========================================================================
  cli:
    build:
      context: .
      dockerfile: cli/Dockerfile
    image: ory-console-cli
    profiles: ["cli"]
    environment:
      # The CLI reaches the backend on the internal network. Overridable, but the
      # default points at the in-stack backend service.
      CONSOLE_API_URL: ${CONSOLE_API_URL:-http://backend:8080}
      # The issued console API key (from the console API-keys page). Passed through
      # from the operator's environment / .env — NEVER inlined, NEVER on argv.
      CONSOLE_API_KEY: ${CONSOLE_API_KEY:-}
    networks: [internal]
    # NO ports: — internal-only (INFRA-05). NO depends_on FROM the base stack
    # points here; the CLI is optional and run on demand.

  # ===========================================================================
  # Frontend (Next.js skeleton). Edge-only; publishes 3000 to host.
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
    container_name: frontend
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # FE-05 server-only backend egress target (05-RESEARCH Pattern 1 + 3). The
      # browser NEVER sees this: the Next server reads it at runtime for both the
      # `/backend/*` rewrite and the (console) layout's authoritative /me guard,
      # so the internal backend host stays out of the client bundle (asserted by
      # scripts/verify/bundle-egress.sh). It points at the backend container on
      # the shared `edge` network; it is intentionally NOT a NEXT_PUBLIC_ var.
      BACKEND_INTERNAL_URL: http://backend:8080
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      # Generous start_period: the Next standalone server is light to boot, but
      # we gate the frontend's readiness behind a healthy backend (below) so the
      # /api/health probe and the server-side /me guard have a live egress target.
      start_period: 30s
    depends_on:
      # The frontend's server-side rewrite + (console) /me guard both reach
      # backend:8080; gate the frontend (and `--wait`) on a healthy backend so the
      # very first request from the live auth e2e finds a reachable egress target.
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks: [edge]

  # ===========================================================================
  # Account Experience (AX) — the self-hosted end-user auth UI (Phase 15, AX-01/
  # AX-05). A separate Next.js 16 service on @ory/elements-react + @ory/nextjs that
  # serves Kratos v26.2.0 self-service flows (login/registration/recovery/
  # verification/settings/error) through the @ory/nextjs createOryMiddleware
  # SAME-ORIGIN proxy to Kratos PUBLIC :4433.
  #
  # DUAL-HOMED (mirrors the Polis dual-home precedent above): `internal` so the
  # AX SERVER can reach `ory-kratos:4433` (PUBLIC) for the proxy target, and
  # `edge` so the browser reaches it via the host-published port. INFRA-05: the
  # AX is given ONLY the Kratos PUBLIC URL (:4433); it has NO admin URL env and
  # MUST NEVER reach :4434 (admin) / Hydra/Keto/Oathkeeper admin — the phase15
  # acceptance gate asserts :4434 is refused from this container. Kratos PUBLIC
  # :4433 is NOT an admin port, so dual-homing to reach only :4433 is INFRA-05
  # compliant.
  #
  # SEPARATE ORIGIN from the console frontend (AX-05): host-published on a DISTINCT
  # port (3001 by default vs the console's 3000) so the AX issues only Kratos
  # cookies (ory_kratos_session, csrf_token), never the console's
  # __Host-console_session (whose __Host- prefix structurally forbids a Domain
  # attribute and so can never reach the AX origin).
  # ===========================================================================
  account-experience:
    build:
      context: ./account-experience
    container_name: account-experience
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # SERVER-ONLY proxy target (threat T-15-04): the @ory/nextjs middleware +
      # the per-flow getLoginFlow/etc read this to reach Kratos PUBLIC on the
      # internal network. It is NOT a NEXT_PUBLIC_ var, so the internal hostname
      # never reaches the client bundle. ORY_PROJECT_API_TOKEN is intentionally
      # UNSET (Network-only; harmless when absent for self-hosted).
      #
      # MUST string-match Kratos's `serve.public.base_url` ORIGIN (config/kratos/
      # kratos.yml -> `http://kratos:4433/`). @ory/nextjs makes the proxied flows
      # same-origin by string-REPLACING this value with the AX origin in every
      # Kratos response URL (middleware `rewriteUrls` + server-component
      # `rewriteJsonResponse`). If this host differs from the host Kratos stamps
      # into `ui.action` (it stamps `base_url`), the replace never fires and the
      # login form keeps an unreachable internal action — so use `kratos:4433`
      # here, NOT the `ory-kratos` container alias (both resolve on the network;
      # only `kratos` matches base_url's string).
      ORY_SDK_URL: http://kratos:4433
      # @ory/nextjs derives the BROWSER-facing flow URLs (the flow-init redirect to
      # /self-service/<flow>/browser and the rewrite target for ui.action) two
      # different ways: in "production" it assumes ORY_SDK_URL is itself browser-
      # reachable (the Ory Network case) and points the browser straight at it; in
      # non-production it derives the public origin from the request Host header.
      # Our topology is the Network-inverse — Kratos is internal-only and reached
      # ONLY through the same-origin middleware proxy — which matches the NON-prod
      # derivation (request-Host origin = http://localhost:3001). Without this the
      # browser is 307'd to the internal http://kratos:4433 and the AX never loads.
      # This flag is read by @ory/nextjs's own `getEnv()` (dynamic process.env
      # lookup, NOT Next's build-time inliner) and ONLY influences URL derivation
      # (`isProduction()` is used nowhere else in @ory/nextjs — cookie `secure` is
      # gated on x-forwarded-proto, not this). The REAL NODE_ENV stays "production"
      # (baked into the standalone build), so React/Next remain fully optimized.
      NEXT_PUBLIC_NODE_ENV: "development"
      # PUBLIC, browser-reachable AX origin (must match the host the operator opens
      # and the `selfservice.flows.*.ui_url` origin in config/kratos/kratos.yml).
      # ory.config.ts feeds this to Ory Elements as `sdk.url` — the base Elements
      # uses IN THE BROWSER for the "Sign up"/"Forgot password?" links and for
      # client-side flow submission. It is the PUBLIC origin (safe to reach the
      # client bundle), NOT the internal Kratos host (ORY_SDK_URL stays server-only).
      AX_PUBLIC_URL: http://localhost:3001
      # AX-02/AX-03 override files (theming + localization). The AX reads
      # theme.css + translations.json from this READ-ONLY mounted dir at BOOT
      # (lib/overrides.ts). The backend's PUT /api/account-experience/* routes are
      # the sole writers (host ./config/account-experience). A console edit applies
      # on the next AX RESTART (the server re-reads the files at process start —
      # no rebuild, 15-RESEARCH A3). Server-side fs read only; never bundled.
      AX_OVERRIDES_DIR: /etc/account-experience-config
      # AX-01 (SSO-06 surfacing): the SERVER-ONLY backend base URL the AX login's
      # domain->SSO HINT server route (app/api/sso-lookup) calls. The AX reaches
      # the backend over the SHARED `edge` network (the backend is dual-homed
      # [internal, edge]); the browser never sees this host — it only hits the
      # same-origin AX route, which proxies to `GET /api/sso/hint` here. It is NOT
      # a NEXT_PUBLIC_ var, so the internal backend hostname never reaches the
      # client bundle (threat T-15-18). The org lookup goes through the BACKEND,
      # never Kratos (BACK-01 / T-15-19) — distinct from the Kratos-public proxy
      # (ORY_SDK_URL), which serves ONLY the self-service flows.
      BACKEND_INTERNAL_URL: http://backend:8080
    healthcheck:
      # Next standalone server has global fetch; probe over loopback with
      # redirect:'manual' (same node-fetch shape as the frontend/Polis services).
      # We probe a Next INTERNAL path (/_next/static) rather than a flow page:
      # a flow page (e.g. /auth/login) server-fetches the Kratos flow and 303-
      # redirects when initiated outside a browser, which a following fetch can
      # not resolve — that is liveness noise, not a health signal. A static asset
      # request returns a stable status from the AX server itself the moment it is
      # up. ANY response (incl. 404 for a non-existent asset) proves the server is
      # listening; only a connection error / 5xx is unhealthy.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/_next/static/health-probe',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      # Gate readiness (and `--wait`) on a healthy Kratos so the very first proxied
      # flow init finds a reachable Kratos public endpoint. CLI-builder: now
      # `required: false` (cross-profile) so a Kratos-`off` selection (svc-kratos
      # profile dropped) does not break the AX startup — the AX is itself only
      # meaningful with Kratos present, but the dep must not wedge compose when
      # Kratos is absent.
      kratos:
        condition: service_healthy
        required: false
    ports:
      - "${ACCOUNT_EXPERIENCE_PORT:-3001}:3000"
    volumes:
      # AX-02/AX-03: the console-owned theming + localization override files,
      # mounted READ-ONLY (`:ro`). The same host dir is the backend's
      # {config_dir}/account-experience (config_dir=/etc/config), so a console PUT
      # write is visible here; the AX reads theme.css + translations.json at boot
      # (AX_OVERRIDES_DIR). READ-ONLY: the AX is a consumer, never a writer — only
      # the backend writes these files. The files are NOT baked into the image
      # (the Dockerfile copies only the standalone build output), so they are
      # purely console-owned, mounted state.
      - ./config/account-experience:/etc/account-experience-config:ro
    # ax-public: reach Kratos PUBLIC :4433 server-side (NOT the broad `internal`
    # network, so no route to Hydra/Keto/Oathkeeper admin — INFRA-05/T-15-01).
    # edge: host-publish the AX origin for the browser.
    networks: [ax-public, edge]

  # ===========================================================================
  # Ory Polis (SAML→OAuth2 bridge — Phase 13, SSO-01).
  #
  # Ory Polis IS BoxyHQ Jackson, re-versioned into the Ory v26.2.0 line. The
  # `ory/polis` Docker Hub repo is 404 (verified 2026-05-26); the registry-
  # pullable, v26.2.0-line image is `boxyhq/jackson:26.2.0` (manifest HTTP 200,
  # re-verified at execution via `docker manifest inspect`). NO :latest (INFRA-04).
  #
  # Node/Next image (NOT Go/distroless like the Ory services) — it HAS a shell,
  # so a node-fetch CMD-SHELL healthcheck on /api/health works (same pattern as
  # the frontend above). Polis self-migrates at boot, so there is NO polis-migrate
  # one-shot (unlike the Ory services).
  #
  # Dual-homed (D-01): `internal` so Kratos + the backend reach its OIDC/admin
  # surface server-side, and `edge` so the browser reaches the issuer redirect/
  # login endpoints (the split-horizon issuer constraint). CRITICAL: NO `ports:`
  # block — the admin/OIDC port 5225 is NEVER host-published (INFRA-05); the
  # browser reaches the public issuer through the operator's edge reverse proxy.
  #
  # All secrets (DB_ENCRYPTION_KEY, API_KEYS, NEXTAUTH_SECRET, OPENID_RSA_*) are
  # injected from .env via `${VAR:?}` — never inlined (BACK-07 write-only posture).
  # DB_ENCRYPTION_KEY + OPENID_RSA_PRIVATE_KEY are IMMUTABLE after first boot
  # (rotating either strands encrypted rows / invalidates issued tokens).
  # ===========================================================================
  polis:
    image: boxyhq/jackson:26.2.0
    container_name: polis              # MUST match Service::Polis.container() (13-02) + broker regex
    profiles: ["svc-polis"]
    # IN-02: ingest the console-managed NON-secret settings file. The /api/config/
    # polis writer persists allowlisted KEY=value pairs to host
    # `./config/polis/settings.env` (== the backend's `<config_dir>/polis/
    # settings.env`, with config_dir=/etc/config). Wiring it here is what makes a
    # console edit actually take effect in Polis: these env vars are read at
    # container CREATE, so an edited setting is ingested on the next compose
    # up/recreate. (A bare broker `restart` restarts the EXISTING container and does
    # NOT re-read the file; the writer's restart proves the file persisted + Polis
    # returns healthy. Full re-ingestion of an edited value lands on recreate. This
    # closes the latent gap where the file was written but never consumed.)
    # `required: false` so the FIRST boot (file may be absent before any edit) does
    # not abort compose; a committed placeholder `config/polis/settings.env` makes
    # it present from the start. CRITICAL precedence: the `environment:` block below
    # is applied AFTER `env_file` and WINS on any duplicate key (Compose merges
    # env_file first, then `environment` overrides) — so the write-only secrets,
    # `EXTERNAL_URL`, and `OPENID_REDIRECT_EXACT_MATCH: "true"` hardening stay
    # authoritative and can NEVER be weakened through the settings file, even though
    # the writer already rejects those keys (defense in depth).
    env_file:
      - path: ./config/polis/settings.env
        required: false
    environment:
      DB_ENGINE: sql
      DB_TYPE: postgres
      DB_URL: postgres://polis:${POLIS_DB_PASSWORD:?set POLIS_DB_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/polis?sslmode=${POSTGRES_SSLMODE:-disable}
      # 32-byte base64; write-only (BACK-07), IMMUTABLE after first boot (Pitfall 5).
      DB_ENCRYPTION_KEY: ${POLIS_DB_ENCRYPTION_KEY:?set POLIS_DB_ENCRYPTION_KEY}
      # Admin-API auth (Authorization: Api-Key) — the backend is the sole client (Phase 14).
      # BoxyHQ Jackson reads the management-API key from JACKSON_API_KEYS; the bare
      # API_KEYS name is NOT honoured by the SSO-connection auth middleware (verified
      # live in Phase 14: API_KEYS alone -> 401 on POST/GET /api/v1/sso). We set BOTH
      # for forward/backward compatibility; JACKSON_API_KEYS is the authoritative one.
      JACKSON_API_KEYS: ${POLIS_API_KEY:?set POLIS_API_KEY}
      API_KEYS: ${POLIS_API_KEY}
      # Single public issuer URL — reachable identically by the browser AND by
      # Kratos server-side (split-horizon, Pattern A). All OIDC/discovery endpoints
      # are derived from this one base.
      EXTERNAL_URL: ${POLIS_EXTERNAL_URL:?set POLIS_EXTERNAL_URL}
      NEXTAUTH_URL: ${POLIS_EXTERNAL_URL}
      NEXTAUTH_SECRET: ${POLIS_NEXTAUTH_SECRET:?set POLIS_NEXTAUTH_SECRET}
      OPENID_RSA_PRIVATE_KEY: ${POLIS_OPENID_RSA_PRIVATE_KEY:?set POLIS_OPENID_RSA_PRIVATE_KEY}
      OPENID_RSA_PUBLIC_KEY: ${POLIS_OPENID_RSA_PUBLIC_KEY:?set POLIS_OPENID_RSA_PUBLIC_KEY}
      OPENID_REDIRECT_EXACT_MATCH: "true"   # hardening (added in v26.2.0)
      HOST_URL: 0.0.0.0
      HOSTNAME: 0.0.0.0
      PORT: "5225"
      BOXYHQ_NO_TELEMETRY: "1"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      # Polis is a Node image (has a shell + global fetch); probe /api/health
      # (200 healthy, 5xx unhealthy) over loopback — same node-fetch shape as the
      # frontend. If a runtime build lacks global fetch, swap to wget.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5225/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    # internal: Kratos + backend reach; edge: browser reaches the issuer.
    networks: [internal, edge]
    # NO ports: — admin/OIDC port 5225 stays internal-only (INFRA-05).

  # ===========================================================================
  # OBSERVABILITY PROFILE (Phase 16, OBS-01/02) — opt-in, DEFAULT OFF.
  # ===========================================================================
  # Four services gated behind `profiles: ["observability"]` (the echo-receiver
  # `acceptance`-profile precedent): a plain `docker compose up` does NOT start
  # them; `docker compose --profile observability up` does. ALL on the `internal`
  # network with NO `ports:` block — no new host-published port (INFRA-05). Image
  # tags are pinned via the x-images anchors (INFRA-04). Cross-profile depends_on
  # uses `required: false` (compose v2.20.2+) so the base stack is NEVER broken
  # when the profile is absent (Pitfall 3 / T-16-07); NO base-stack service
  # depends_on any of these.
  # ---------------------------------------------------------------------------
  prometheus:
    image: *prometheus-image
    container_name: prometheus
    profiles: ["observability"]
    # NB: --web.enable-admin-api is deliberately NOT passed (the management API can
    # delete all metrics / shut down the server — T-16-02). Default flags + an
    # explicit config path + the persistent TSDB volume only.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [internal]
    # NO ports: — Prometheus is never host-published; the backend (16-02) queries
    # it container-to-container on the internal network.

  loki:
    image: *loki-image
    container_name: loki
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks: [internal]
    # NO ports: — Loki push (Alloy) + query (backend/Grafana) are internal-only.

  alloy:
    image: *alloy-image
    container_name: alloy
    profiles: ["observability"]
    # File-tail log source (BACK-05): Alloy reads the Docker json-file log dir
    # READ-ONLY and ships to Loki. It mounts NO Docker socket (the broker stays the
    # SOLE socket holder) and is NEVER routed through the wollomatic broker
    # (grafana/alloy#4246). Run with the config + a writable data dir for positions.
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--storage.path=/var/lib/alloy/data"
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # READ-ONLY Docker json-file container logs — the file-tail source. NOT the
      # socket. Requires the host's default json-file logging driver (16-RESEARCH
      # A3); the README documents the :ro-socket fallback if a different driver is
      # in use.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      # Cross-profile dep: start after Loki when the profile is up, but
      # required:false so the absence of the profile never breaks the base stack.
      loki:
        condition: service_started
        required: false
    networks: [internal]
    # NO ports: — Alloy pushes to Loki internally; no host surface.

  grafana:
    image: *grafana-image
    container_name: grafana
    profiles: ["observability"]
    environment:
      # Served from a sub-path behind the backend reverse-proxy (16-02).
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Admin password from the secret FILE — NEVER the default admin/admin (T-16-03).
      # The `$$` escapes compose's own variable interpolation so Grafana receives
      # the LITERAL `$__file{...}` directive (a single `$` would make compose try to
      # expand a `__file` variable and pass an empty password).
      GF_SECURITY_ADMIN_PASSWORD: "$$__file{/run/secrets/grafana_admin_password}"
      # Auth-proxy header auth: only the backend (which injects X-WEBAUTH-USER for
      # the authenticated console operator) can authenticate; the login form is
      # disabled so Grafana never terminates its own login (T-16-03).
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "X-WEBAUTH-USER"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # WR-05 (auth-proxy spoof defense-in-depth): Grafana honors the
      # X-WEBAUTH-USER auth-proxy header ONLY when the request's SOURCE IP is in
      # this whitelist — pinned to the backend's STATIC internal IP (172.30.0.10,
      # see the `internal` network ipam + the backend's ipv4_address). Without
      # this, ANY peer on the shared `internal` network (Postgres, the four Ory
      # services, the restart broker, Loki/Prometheus/Alloy) could bypass the
      # backend and POST grafana:3000 with a forged X-WEBAUTH-USER to auto-provision
      # a Grafana admin (GF_AUTH_PROXY_AUTO_SIGN_UP). The whitelist accepts IPs/CIDRs
      # only (not hostnames), which is why the backend is given a static IP. The
      # backend proxy still strips client-supplied X-WEBAUTH-* headers (T-16-10);
      # this closes the orthogonal "peer bypasses the backend entirely" threat.
      GF_AUTH_PROXY_WHITELIST: "172.30.0.10"
      # No outbound analytics/update checks from an internal-only service (BACK-07).
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      # Cross-profile deps (required:false — Pitfall 3 / T-16-07): Grafana's
      # datasources point at prometheus + loki, but their absence must never break
      # the base stack (it cannot, since grafana is itself profiled).
      prometheus:
        condition: service_started
        required: false
      loki:
        condition: service_started
        required: false
    networks: [internal]
    # NO ports: — Grafana is reachable ONLY via the authenticated backend proxy
    # (16-02); never host-published (INFRA-05 / Pitfall 1).

  # ===========================================================================
  # Echo receiver (Phase 11 — TEST/CI ONLY, gated behind the `acceptance`
  # profile). The webhook-delivery SUCCESS target for scripts/verify/
  # phase11-acceptance.sh: a tiny HTTP server that 200s every POST and prints the
  # request method, path, every header (incl. X-Console-Signature), and the raw
  # body to stdout, so the gate can read `docker compose logs echo-receiver`,
  # extract the signature the worker sent, and verify the HMAC against the
  # webhook's secret. It lives ONLY on the `internal` network (never host-
  # published) and ONLY runs when the `acceptance` profile is selected, so a
  # normal `docker compose up` does NOT start it (threat T-11-28). The SSRF
  # NEGATIVE targets (169.254.169.254 / 127.0.0.1 / an internal Ory admin
  # host:port) need NO sidecar — they must be rejected before any connection.
  echo-receiver:
    image: python:3.12-alpine
    container_name: echo-receiver
    profiles: ["acceptance"]
    # Unbuffered stdout (-u) so each request line is flushed to the container log
    # immediately and the gate can poll for it. The handler reflects nothing
    # sensitive — it only echoes what the worker chose to send.
    command:
      - "python"
      - "-u"
      - "-c"
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer
        import sys
        class H(BaseHTTPRequestHandler):
            def _handle(self):
                length = int(self.headers.get('Content-Length', 0) or 0)
                body = self.rfile.read(length) if length else b''
                # One machine-greppable line per header + a body line. The gate
                # parses ECHO-HEADER X-Console-Signature: <sig> and ECHO-BODY <...>.
                for k, v in self.headers.items():
                    print(f"ECHO-HEADER {k}: {v}", flush=True)
                print(f"ECHO-METHOD {self.command} {self.path}", flush=True)
                print(f"ECHO-BODY {body.decode('utf-8', 'replace')}", flush=True)
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(b'{"ok":true}')
            def do_POST(self):
                self._handle()
            def do_GET(self):
                self._handle()
            def log_message(self, *a):
                pass
        print("echo-receiver listening on 0.0.0.0:9000", flush=True)
        HTTPServer(('0.0.0.0', 9000), H).serve_forever()
    networks: [internal]
    # NO host ports — reachable only from the backend over the internal network.
