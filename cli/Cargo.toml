[package]
name = "ory-console-cli"
version = "0.1.0"
edition = "2021"
publish = false
description = "Optional Ory Self-Hosted Console operator CLI (Phase 19 / CLI-02..06). Two non-overlapping modes: ONLINE — an authenticated HTTP client of the EXISTING backend routes (Authorization: Api-Key <raw>), never a second writer of YAML or the console DB; and BOOTSTRAP — pre-boot filesystem writes of gitignored .env/secret paths only. Secrets are NEVER accepted on argv (env var / --*-file / hidden prompt only)."
license = "Apache-2.0"

[[bin]]
name = "ory-console"
path = "src/main.rs"

[lib]
name = "console_cli"
path = "src/lib.rs"

# Default deps carry NO sqlx and NO YAML writer (T-19-11 / Pitfall 4): the CLI is
# an HTTP-only client in ONLINE mode + a plain `.env`/secret-file writer in
# BOOTSTRAP mode. `cargo tree -p ory-console-cli` (default features) proves the
# absence of sqlx. The offline DB-direct admin path (admin create/reset-password)
# is gated behind the OFF-by-default `offline-admin` feature so the default build
# is provably never a second writer of the console DB.
[dependencies]
clap = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
console-core = { path = "../console-core" }

# CLI-builder Wave 2 (CONFIG-TOML): the declarative `console.config.toml` parser.
# `toml` is the de-facto Rust TOML crate (github.com/toml-rs/toml — the same family
# cargo itself uses for Cargo.toml). It is PURE-SERDE: no native/build code, no C
# deps, so it does NOT pull sqlx or any heavy graph into the default CLI build
# (the no-second-writer `cargo tree` check stays clean). Package-legitimacy note
# recorded in the Wave-2 SUMMARY (canonical owner, ~646M downloads).
toml = "0.9"

# CLI-builder Wave 3 (WIZARD): the CSPRNG used to GENERATE missing required
# secrets (DB role passwords, HYDRA_SECRETS_SYSTEM, Polis keys) into the
# gitignored `.env`. `getrandom` is the canonical, audited OS-RNG façade
# (github.com/rust-random/getrandom — the foundation under `rand`); 0.3.4 is
# ALREADY in the default CLI lockfile (transitively via reqwest's rustls
# build-deps), so adding it as a direct dep introduces NO new crate and NO heavy
# graph — `cargo tree` still shows no sqlx/argon2 (no-second-writer intact). We
# use `getrandom::fill(&mut [u8])` directly (no `rand` distribution layer).
getrandom = "0.3"

# CLI-builder BYO-Postgres (IUX-BYO-PG-03): the REAL `SELECT 1` connection check.
# NON-optional, in the DEFAULT feature set — the connection check ships in every
# build (the explicit requirement). These are PURE-RUST (tokio-postgres protocol +
# tokio-postgres-rustls bound to the SAME rustls 0.23 + aws-lc-rs provider reqwest
# already uses) — NOT sqlx, NOT argon2, NOT openssl/native-tls. Package-legitimacy
# + the no-sqlx/no-argon2 `cargo tree` gate are recorded in the workspace Cargo.toml
# and the IUX SUMMARY.
tokio-postgres = { workspace = true }
tokio-postgres-rustls = { workspace = true }
rustls = { workspace = true }

# Phase 20 (CLI-07 / CLI Operator Experience Redesign): the console-rs terminal-UX
# stack, routed THROUGH the single `ui` module. The two `default-features = false`
# trims are LOAD-BEARING for the lean build:
#   - dialoguer's default `editor` feature → tempfile (+ getrandom/rand_core); we
#     never launch $EDITOR, so it is dropped. Keeping ONLY `password` gives the
#     masked Password widget (and pulls `zeroize`, which is DESIRABLE for secret
#     buffers).
#   - comfy-table's default `tty` feature → crossterm (+ crossterm_winapi/winapi/
#     parking_lot); we resolve width via `ui`/`console`, so it is dropped.
# With those trims all four crates share ONE console-rs terminal backend (no
# crossterm mix) and the lean gate stays green — `cargo tree -p ory-console-cli`
# (default features) shows NO sqlx / argon2 / crossterm / openssl / native-tls.
# All four are HIGH-confidence-legitimate per 20-RESEARCH's Package Legitimacy
# Audit (canonical console-rs/nukesor repos, ~14–60M downloads, and a real
# resolve + compile in THIS workspace).
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
console = "0.16"
indicatif = "0.18"
comfy-table = { version = "7", default-features = false }

# The Argon2id hasher + sqlx are pulled in ONLY when the operator opts into the
# offline DB-direct admin path. Reuses the SAME pins/regime as the backend so the
# password-hash format is byte-compatible with the console.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros"], optional = true }
argon2 = { version = "0.5", optional = true }
rand_core = { version = "0.6", features = ["std"], optional = true }

[features]
# `wave3` is ON by default from Plan 20-03 onward: the forward-referenced
# `check` symbols (`console_cli::check::overall_exit_code`) now EXIST, so the
# Wave-0 `check_exit_code_reflects_health` assertion body compiles + runs as part
# of the normal `cargo test -p ory-console-cli`. It pulls NO production code (the
# gate only un-comments a test body). `wave1` stays available for the symmetric
# Wave-1 contract.
default = ["wave3"]
# OFF by default — pulls in sqlx + argon2 for the offline DB-direct admin
# create/reset-password path. The default CLI build carries neither (no-second-writer).
offline-admin = ["dep:sqlx", "dep:argon2", "dep:rand_core"]
# Phase-20 Wave-0 test-contract gates (NO production dependency — they pull no
# code; they only un-gate the forward-referenced assertion bodies in
# `cli/tests/cli_ux.rs`). The bodies reference LOCKED future symbols
# (`console_cli::ui::*` for Wave 1, `console_cli::check::overall_exit_code` for
# Wave 3) that do not exist on today's surface, so the assertions are compiled OUT
# by default and the file builds against today's surface. Once a wave implements
# its symbols it flips the gate ON (e.g. `cargo test -p ory-console-cli
# --features wave1 -- --ignored multiselect_defaults_match_current`) to RUN the
# pre-written contract. Both stay OFF in the default + release builds.
wave1 = []
wave3 = []

[dev-dependencies]
mockito = "1"
tempfile = "3"
clap = { workspace = true }
